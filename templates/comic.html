{% extends "layout.html" %}

{% block title %}Sarjakuvat{% endblock %}

{% block content %}

<h2>Sarjiksen tiedot</h2>
    {{ comic.title }}
     <hr/>
    {{ comic.desc }}
    <hr/>
    {% if user_id ==  comic.adder_id %}
        Voit muokata sarjista tai poistaa sen.
        <div>
            <a href="/edit_comic/{{ comic.cid }}">Muokkaa</a>
        </div>
        <div>
            <a href="/delete_comic/{{ comic.cid }}">Poista</a>
        </div>
    {% endif %}

{% endblock %}
